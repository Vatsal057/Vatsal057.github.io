name: Deploy companion Worker

# Keeps the whole thing "on GitHub": the Worker source and this pipeline live in
# the repo, and GitHub Actions is what deploys it. Cloudflare only executes it.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
      # the companion's knowledge is generated from these, so editing a project
      # must redeploy the Worker or the chatbot would answer from stale data
      - 'projects-data.js'
      - 'index.html'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
